<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Copywriting &amp; Tone Transformer</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <div class="wrap">
    <header class="header">
      <h1>Copywriting &amp; Tone Transformer</h1>
      <p class="subtitle">Compile one product into platform-ready marketing copy.</p>
    </header>

    <main class="grid">
      <form id="gen-form" class="panel form-panel">
        <label>
          Product Name
          <input type="text" id="product_name" placeholder="e.g. AquaFlow Smart Bottle" required />
        </label>

        <label>
          Product Description
          <textarea id="description" rows="4" placeholder="What does it do? Who's it for? What makes it different?" required></textarea>
        </label>

        <label>
          Tone
          <input type="text" id="tone" list="tone-options" placeholder="e.g. Witty, Professional, Bold" required />
          <datalist id="tone-options">
            <option value="Professional"></option>
            <option value="Witty"></option>
            <option value="Persuasive"></option>
            <option value="Casual"></option>
            <option value="Luxurious"></option>
            <option value="Urgent"></option>
          </datalist>
        </label>

        <label>
          Platform
          <select id="platform">
            {% for p in platforms %}
            <option value="{{ p }}">{{ p }}</option>
            {% endfor %}
            <option value="All">All platforms</option>
          </select>
        </label>

        <div class="sliders">
          <label>
            Temperature <span id="temp-val" class="slider-val">0.70</span>
            <input type="range" id="temperature" min="0" max="1.5" step="0.05" value="0.7" />
            <span class="hint">Lower = focused &amp; consistent · Higher = creative &amp; varied</span>
          </label>

          <label>
            Top_P <span id="top-p-val" class="slider-val">0.95</span>
            <input type="range" id="top_p" min="0" max="1" step="0.05" value="0.95" />
            <span class="hint">Nucleus sampling — lower narrows word choice</span>
          </label>
        </div>

        <button type="submit" id="generate-btn">Generate copy</button>
        <p id="error-msg" class="error-msg" hidden></p>
      </form>

      <section id="results" class="panel results-panel">
        <p class="empty-state">Generated copy will appear here.</p>
      </section>
    </main>
  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
